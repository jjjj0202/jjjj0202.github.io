---
title: HTB
layout: default
---

<section class="wrapper style1">
  <div class="container">
    <div id="content">
      <section>
        <header class="major">
          <h2>HTB</h2>
        </header>
<style>
  .htb-thumbnail {
    height: 190px;
    overflow: hidden;
    border-radius: 8px;
    background: #101722;
  }
  .htb-thumbnail img {
    width: 100%;
    height: 100% !important;
    object-fit: contain;
  }
  @media (max-width: 700px) {
    .box.post .htb-thumbnail {
      float: none;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      margin: 0 0 1.25em;
    }
    .box.post .inner { margin-left: 0; }
  }
</style>
        {% assign entries = site.post2 | sort: 'date' | reverse %}
        {% if entries.size > 0 %}
          {% for post in entries %}
            <div class="row">
              <section class="12u">
                <div class="box post">
                  {% if post.featured %}<a href="{{ post.url }}" class="image left htb-thumbnail"><img src="{{ post.featured }}" alt="{{ post.title | escape }}" loading="lazy"></a>{% endif %}
                  <div class="inner">
                    <h3>{{ post.title }}</h3>
                    <footer><a href="{{ site.baseurl }}{{ post.url }}" class="button">Continue Reading</a></footer>
                  </div>
                </div>
              </section>
            </div>
          {% endfor %}
        {% else %}
          <p>아직 등록된 HTB 글이 없습니다.</p>
        {% endif %}
      </section>
    </div>
  </div>
</section>
